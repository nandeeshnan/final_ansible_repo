name: Deploy EC2 with NGINX and Flask

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible and AWS collection
        run: |
          pip install ansible boto3
          ansible-galaxy collection install amazon.aws

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Run Ansible Playbook to launch EC2
        run: ansible-playbook main.yml

      - name: Read public IP from file
        id: get_ip
        run: |
          IP=$(cat ec2_instance_ip.txt)
          echo "INSTANCE_IP=$IP" >> $GITHUB_ENV

      - name: Save Private Key
        run: |
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ec2_key.pem
          chmod 400 ec2_key.pem

      - name: Wait for EC2 SSH to be ready
        run: |
          for i in {1..30}; do
            ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ env.INSTANCE_IP }} "echo connected" && break
            echo "Waiting for SSH..." && sleep 10
          done

      - name: Install NGINX on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ env.INSTANCE_IP }} "sudo apt-get update && sudo apt-get install -y nginx"

      - name: Test NGINX installation
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ env.INSTANCE_IP }} "sudo nginx -t"

      - name: Restart NGINX
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ env.INSTANCE_IP }} "sudo systemctl restart nginx"

      # Copy Flask app to EC2
      - name: Copy Flask app to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ec2_key.pem flask_app.py ubuntu@${{ env.INSTANCE_IP }}:/home/ubuntu/flask_app.py

      # Install Flask and dependencies on EC2 using virtual environment
      - name: Install Flask on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ env.INSTANCE_IP }} "
            # Install python3-venv if not already installed
            sudo apt-get install -y python3-venv

            # Create a virtual environment in the home directory
            python3 -m venv /home/ubuntu/venv

            # Activate the virtual environment and install Flask
            source /home/ubuntu/venv/bin/activate
            pip install flask
          "

      # Configure NGINX to proxy to Flask
      - name: Configure NGINX to proxy requests to Flask
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ env.INSTANCE_IP }} "
            echo 'server {
              listen 80;
              server_name localhost;

              location / {
                proxy_pass http://127.0.0.1:5000;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }
            }' | sudo tee /etc/nginx/sites-available/default > /dev/null
            sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default

          "

      # Run Flask app in the background using nohup
      - name: Run Flask app on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ env.INSTANCE_IP }} "
            source /home/ubuntu/venv/bin/activate
            nohup python3 /home/ubuntu/flask_app.py > flask.log 2>&1 &
          "


      # Check if Flask is running through NGINX
      - name: Check Flask app through NGINX
        run: |
          for i in {1..30}; do
            curl -s http://${{ env.INSTANCE_IP }} && break
            echo "Waiting for Flask app..." && sleep 10
          done
