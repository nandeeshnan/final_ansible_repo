- name: Create EC2 Instance
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    key_name: ansible-ec2-key
    instance_type: t2.micro
    image_id: ami-04f167a56786e4b09 
    region: us-east-2
    vpc_subnet_id: subnet-0f54d3d932601a661
    security_group_id: sg-0ffc3795cd46f58d4
    tag_name: ansible-instance
  tasks:
    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ image_id }}"
        wait: yes
        count: 1
        region: "{{ region }}"
        vpc_subnet_id: "{{ vpc_subnet_id }}"
        security_group_ids: ["{{ security_group_id }}"]
        tags:
          Name: "{{ tag_name }}"
          Project: ansible-demo
        assign_public_ip: yes
      register: ec2

    - name: Print public IP
      debug:
        msg: "EC2 Public IP: {{ ec2.instances[0].public_ip }}"
